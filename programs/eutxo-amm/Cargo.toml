[package]
name = "eutxo-amm"
version = "0.1.0"
description = "Constant-product AMM for bridged eUTXO-chain assets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "eutxo_amm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token", "associated_token"] }
